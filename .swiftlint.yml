included:
  - SwiftPili
  - Packages/PiliPlayerKit/Sources

excluded:
  - .build
  - "**/.build"
  - DerivedData
  - "**/DerivedData"
  - .claude

disabled_rules:
  - trailing_comma
  - opening_brace

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

line_length:
  warning: 120
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100
